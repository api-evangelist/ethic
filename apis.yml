description: Ethic is an SEC-registered technology-driven asset manager that helps financial
  advisors and institutions build and manage highly customized, values-aligned, and
  tax-smart investment portfolios at scale. Its platform centralizes client portfolio
  management across direct indexing, model portfolios, and unified managed accounts (UMAs),
  letting advisors personalize holdings to individual values and tax situations. Ethic
  is a private, advisor- and institution-facing platform and publishes no public developer
  API, developer portal, SDKs, or webhooks as of this profiling.
